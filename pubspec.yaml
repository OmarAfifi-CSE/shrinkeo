name: shrinkeo
description: "Offline batch video and image compression suite for Windows, built for high visual quality and precision control."
publish_to: 'none'
version: 1.3.0+7

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State management
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.1.0

  # File input
  desktop_drop: ^0.7.1
  file_picker: ^11.0.2

  # Utilities
  path: ^1.9.1
  google_fonts: ^8.2.0
  window_manager: ^0.5.2
  local_notifier: ^0.1.6
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  ffi: ^2.2.0
  cupertino_icons: ^1.0.9
  animated_list_plus: ^0.5.2
  country_flags: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
